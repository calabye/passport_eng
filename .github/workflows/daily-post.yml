name: daily-post

on:
  # 자동 업로드 보류 중. 다시 쓰려면 아래 두 줄의 # 를 지우고 config.json의 enabled를 true로
  # schedule:
  #   - cron: "0 3 * * *"   # 매일 12:00 KST
  workflow_dispatch:
    inputs:
      post:
        description: "특정 게시물 지정 (예: d01). 비우면 오늘 순서"
        required: false
        default: ""
      dry_run:
        description: "실제로 올리지 않고 점검만 하기"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POST_ID: ${{ inputs.post }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$POST_ID" ]; then ARGS="$ARGS $POST_ID"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node publish.mjs $ARGS

      - name: Save publish log
        run: |
          if [ -n "$(git status --porcelain published.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add published.json
            git commit -m "log: published $(date -u +%F)"
            git push
          fi
